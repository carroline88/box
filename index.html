<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

    <div class="main-container">

    <!--Box 1-->
    <div class="orange-box box1">
        <div class="red-item"></div>
        <div class="red-item"></div>
        <div class="red-item"></div>
    </div>

    <!--Box 2-->
    <div class="orange-box box2">
        <div class="red-item tall"></div>
        <div class="red-item tall"></div>
        <div class="red-item tall"></div>
    </div>

    <!--Box 3-->
    <div class="orange-box box3">
        <div class="red-item"></div>
        <div class="red-item"></div>
        <div class="red-item"></div>
    </div>

    <!--Box 4-->
    <div class="orange-box box4">
        <div class="red-item"></div>
        <div class="red-item"></div>
        <div class="red-item align-bottom"></div>
    </div>

    <!--Box 5-->
    <div class="orange-box box5">
        <div class="red-item with-text medium-text">Some text</div>
        <div class="red-item with-text short-text">Some text</div>
        <div class="red-item with-text tall-text">Some text</div>
    </div>

    <!--Box 6-->
    <div class="orange-box box6">
        <div class="red-item"></div>
        <div class="red-item wide-2"></div>
        <div class="red-item"></div>
    </div>

    </div>

</body>
</html>
